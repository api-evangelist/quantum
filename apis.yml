name: Quantum
description: Quantum is a Saudi Arabian advertising-technology (adtech) enabler that bridges online
  publishers and advertisers with data and technology. Its Quantum One omnichannel platform connects
  online and offline retail experiences across programmatic ads, in-app media buying, e-sampling,
  on-ground activations, influencer marketing, and out-of-home media, with goal-attainment tracking,
  ROI measurement, customer-engagement analytics, and conversion-rate analysis. As of this enrichment
  pass the company publishes no public developer API, documentation, or developer portal; the Quantum
  One tenant application does carry an API-key management screen, so the platform issues keys to
  signed-in customers, but no contract, reference, or machine-readable spec is published anywhere.
